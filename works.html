
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="images/logo1.png">

    <title>My Works | Jhon Job Portfolio</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="site-header">
        <a class="logo" href="index.html">Jhon <span>Job.</span></a>

        <button class="menu-toggle"
                aria-label="Toggle navigation"
                aria-expanded="false">☰</button>
                

        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="account.html">Account</a>
            <a href="profile.html">Profile</a>
            <a class="active" href="works.html">Works</a>
            <a href="experience.html">Experience</a>
        </nav>
        <div class="global-search">
    <input
        type="search"
        id="siteSearch"
        placeholder="Search portfolio..."
        aria-label="Search portfolio"
    >
    <div id="searchResults" class="search-results"></div>
</div>
    </header>

    <main class="page-wrap page-content">

        <p class="eyebrow">MY PROJECTS & CREATIONS</p>

        <h1 class="page-title">My <span>Works</span></h1>

        <p class="page-intro">
            A gallery to display my school projects, designs,
            diagrams, and other creations.
        </p>

        <div class="works-toolbar">
            <label for="work-filter">Filter images</label>

            <select id="work-filter">
                <option value="all">All works</option>
                <option value="draw">Drawing</option>
                <option value="logo">Logo</option>
                <option value="design">Design</option>
            </select>
        </div>

        <!-- WORKS GALLERY -->
       <!-- WORKS GALLERY -->
<section class="works-grid image-gallery" id="works-grid">

    <figure class="gallery-item" data-category="design">
        <img src="images/Bos.jpg"
             alt="Bos Coffee Design"
             data-title="Bos Coffee Design"
             data-description="A promotional design for Bos Coffee featuring Filipino coffee varieties such as Barako, Mt. Apo, and Mt. Kitanglad. The design presents the products, their flavors, and other important information in an attractive layout.">
        <figcaption>Bos Coffee Design</figcaption>
    </figure>

    <figure class="gallery-item" data-category="design">
        <img src="images/Brew.jpg"
             alt="Brew Haven Logo"
             data-title="Brew Haven Logo"
             data-description="A coffee shop branding concept created to represent Brew Haven. This design focuses on creating a recognizable visual identity for a coffee-related business.">
        <figcaption>Brew Haven Logo</figcaption>
    </figure>

    <figure class="gallery-item" data-category="logo">
        <img src="images/Speed.jpg"
             alt="Speed Shop Logo 1"
             data-title="Speed Shop Logo 1"
             data-description="The first logo concept for Speed Shop. It explores a visual identity inspired by bicycles, speed, and cycling culture.">
        <figcaption>Speed Shop Logo 1</figcaption>
    </figure>

    <figure class="gallery-item" data-category="logo">
        <img src="images/Speed2.jpg"
             alt="Speed Shop Logo 2"
             data-title="Speed Shop Logo 2"
             data-description="The second Speed Shop logo concept, exploring another approach to the shop's branding and visual presentation.">
        <figcaption>Speed Shop Logo 2</figcaption>
    </figure>

    <figure class="gallery-item" data-category="logo">
        <img src="images/Speed3.jpg"
             alt="Speed Shop Logo 3"
             data-title="Speed Shop Logo 3"
             data-description="The third Speed Shop logo concept, presenting an alternative design for the bicycle shop's identity.">
        <figcaption>Speed Shop Logo 3</figcaption>
    </figure>

    <figure class="gallery-item" data-category="draw">
        <img src="images/apple.jpg"
             alt="Apple Drawing"
             data-title="Apple Drawing"
             data-description="A drawing of an apple created as an exercise in illustration and visual representation. It demonstrates basic drawing techniques, shapes, and details.">
        <figcaption>Apple</figcaption>
    </figure>

    <figure class="gallery-item" data-category="draw">
        <img src="images/Coffee.jpg"
             alt="Coffee Drawing"
             data-title="Brew Haven Drawing"
             data-description="A coffee-themed drawing that explores illustration, object details, and visual creativity through a simple subject.">
        <figcaption>Brew Haven Drawing</figcaption>
    </figure>

</section>

    </main>

    <!-- FULL SCREEN IMAGE PREVIEW -->
    <!-- FULL SCREEN IMAGE PREVIEW -->
<div class="image-lightbox" id="imageLightbox">

    <button class="lightbox-close"
            id="lightboxClose"
            aria-label="Close image preview">
        &times;
    </button>

    <button class="lightbox-nav prev"
            id="prevImage"
            aria-label="Previous image">
        &#10094;
    </button>

    <div class="lightbox-content">

        <img src=""
             alt="Project Preview"
             id="lightboxImage">

        <div class="lightbox-info">
            <h2 id="lightboxTitle"></h2>
            <p id="lightboxDescription"></p>
        </div>

        <p class="lightbox-counter" id="imageCounter"></p>

    </div>

    <button class="lightbox-nav next"
            id="nextImage"
            aria-label="Next image">
        &#10095;
    </button>

</div>

    <footer class="site-footer">
        <p>© <span class="year"></span> Jhon Job Portfolio</p>
    </footer>

</body>
</html>
